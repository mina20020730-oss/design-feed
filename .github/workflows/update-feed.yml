name: Update feed
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小時（UTC）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # 公開網站只放標題、圖片、卡片摘要與關鍵詞、原文連結，不存全文、不做翻譯
          PUBLIC_SITE: "1"
          # 卡片摘要預設免費（從原文挑代表句）。選用：在 Settings > Secrets and variables > Actions 新增 ANTHROPIC_API_KEY，改用 Claude 寫的摘要（另外計費）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: claude-sonnet-5-5
          AI_MAX: "40"
      - name: Commit feed.json
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed.json config/discovered.json
          git diff --cached --quiet || git commit -m "Update feed"
          git push
